<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b0f14"/><stop offset="1" stop-color="#111820"/></linearGradient>
 <filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".45"/></filter>
</defs>
<style>.name{font:700 25px ui-sans-serif,system-ui,sans-serif;fill:#f0f6fc}.role{font:12px ui-monospace,monospace;fill:#58a6ff;letter-spacing:1.5px}.desc{font:15px ui-sans-serif,system-ui,sans-serif;fill:#8b949e}.num{font:700 44px ui-monospace,monospace;fill:#21262d}.card{fill:#0d1117;stroke:#30363d}.accent{fill:#58a6ff}</style>
<rect width="1200" height="620" rx="20" fill="url(#bg)" stroke="#30363d"/>
<text x="54" y="52" class="role">PROJECT SYSTEM / 01</text><text x="54" y="88" class="name">Six modules. One engineering model.</text>
<g filter="url(#s)" transform="translate(54 124)"><rect width="342" height="200" rx="14" class="card"/><rect width="5" height="200" rx="3" class="accent"/><text x="28" y="45" class="name">Inari</text><text x="28" y="72" class="role">GOVERNANCE</text><text x="28" y="112" class="desc">Canonical lifecycle, policy,</text><text x="28" y="135" class="desc">authority and controlled change.</text><text x="300" y="48" class="num">01</text></g>
<g filter="url(#s)" transform="translate(429 124)"><rect width="342" height="200" rx="14" class="card"/><rect width="5" height="200" rx="3" class="accent"/><text x="28" y="45" class="name">Nawabari</text><text x="28" y="72" class="role">RUNTIME</text><text x="28" y="112" class="desc">Isolated sessions, ownership,</text><text x="28" y="135" class="desc">authorization and recovery.</text><text x="300" y="48" class="num">02</text></g>
<g filter="url(#s)" transform="translate(804 124)"><rect width="342" height="200" rx="14" class="card"/><rect width="5" height="200" rx="3" class="accent"/><text x="28" y="45" class="name">Mottainai</text><text x="28" y="72" class="role">ORCHESTRATION</text><text x="28" y="112" class="desc">Semantic context, coordination</text><text x="28" y="135" class="desc">and agent execution planning.</text><text x="300" y="48" class="num">03</text></g>
<g filter="url(#s)" transform="translate(54 354)"><rect width="342" height="200" rx="14" class="card"/><rect width="5" height="200" rx="3" class="accent"/><text x="28" y="45" class="name">Wabachi</text><text x="28" y="72" class="role">ARCHITECTURE</text><text x="28" y="112" class="desc">Machine-readable architectural</text><text x="28" y="135" class="desc">intent and documentation.</text><text x="300" y="48" class="num">04</text></g>
<g filter="url(#s)" transform="translate(429 354)"><rect width="342" height="200" rx="14" class="card"/><rect width="5" height="200" rx="3" class="accent"/><text x="28" y="45" class="name">Suzukuri</text><text x="28" y="72" class="role">EXECUTION</text><text x="28" y="112" class="desc">Admission, capabilities and</text><text x="28" y="135" class="desc">governed execution boundaries.</text><text x="300" y="48" class="num">05</text></g>
<g filter="url(#s)" transform="translate(804 354)"><rect width="342" height="200" rx="14" class="card"/><rect width="5" height="200" rx="3" class="accent"/><text x="28" y="45" class="name">Shikitari</text><text x="28" y="72" class="role">CANON</text><text x="28" y="112" class="desc">Repository conventions as</text><text x="28" y="135" class="desc">discoverable, applicable canon.</text><text x="300" y="48" class="num">06</text></g>
</svg>